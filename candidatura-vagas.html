
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatura à Vaga</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="logo">PORTAL ESCOLAR</div>
    <nav>
        <a href="index.html">INÍCIO</a>
        <a href="vagas.html">VAGAS</a>
        <a href="curriculo.html">CURRÍCULO</a>
        <a href="contrate.html">CONTRATE</a>
        <a href="perfil.html">MEU PERFIL</a>
    </nav>
</header>

<main class="container">

    <section class="login-box">

        <h1>Candidatura à Vaga</h1>

        <form action="#" method="post" enctype="multipart/form-data">

            <div class="form-group">
                <label for="vaga">ESTÁGIO ESCOLHIDO:</label>
                <select id="vaga" name="vaga" required>
                    <option value="">Selecione a vaga</option>
                    <option>Auxiliar Administrativo</option>
                    <option>Jovem Aprendiz - Comércio (Correios)</option>
                    <option>Jovem Aprendiz - Comércio (Mercadinho Popular)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="nome">NOME COMPLETO:</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    required
                >
            </div>

            <div class="form-group">
                <label for="telefone">TELEFONE:</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    required
                >
            </div>

            <div class="form-group">
                <label for="curriculo">CURRÍCULO:</label>
                <input
                    type="file"
                    id="curriculo"
                    name="curriculo"
                    accept=".pdf,.doc,.docx"
                    required
                >
            </div>

            <button type="submit" class="btn btn-enviar">
                ENVIAR
            </button>

        </form>

    </section>

</main>

<footer>
    Portal Escolar - Sua oportunidade começa aqui.
</footer>

</body>
</html>
